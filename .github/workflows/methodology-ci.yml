# Methodology CI (02 §10, S0b): the deterministic suite on every push/PR.
# No secrets or client data. Controller tests acquire the immutable, lock-driven,
# hash-verified GOV-GEN framework revision before execution.
name: methodology-ci

on:
  push:
  pull_request:

jobs:
  deterministic-suite:
    runs-on: [self-hosted, linux, x64, factory-ci]
    steps:
      - uses: actions/checkout@v4

      - name: Verify preprovisioned Python baseline
        shell: bash
        run: |
          set -euo pipefail
          command -v python3.12 >/dev/null
          python3.12 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'

      - name: Create isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -m venv "$RUNNER_TEMP/hugeplanning-ci"
          echo "$RUNNER_TEMP/hugeplanning-ci/bin" >> "$GITHUB_PATH"

      - name: Install suite dependencies
        run: python -m pip install pyyaml jsonschema pytest hypothesis

      - name: Configure git identity for scratch repos
        run: |
          git config --global user.name "methodology-ci"
          git config --global user.email "ci@local.invalid"

      - name: Run deterministic test suite
        run: tests/run-tests.sh

      - name: Acquire locked GOV-GEN framework
        run: |
          FRAMEWORK_ROOT="$(python3 scripts/acquire-framework.py)"
          echo "GOV_GEN_FRAMEWORK_ROOT=$FRAMEWORK_ROOT" >> "$GITHUB_ENV"

      - name: Run Controller test suite
        run: governance/tests/run-controller-tests.sh
