    - the independent-review corrections incorporated into R1: the non-comparative restatement of base §8's L0-distribution requirement (removing the accidental "materially worse" physical-architecture comparison); the addition of register entry RD-C9 testing the "exactly one Owner/authority domain" hidden assumption against G3 §4's L0/L3 authority_boundary split; the re-grounding of RD-B3/RD-C6's evidence_refs in GOV-GEN's own observed sequential ID-allocation practice instead of a rule G3 §6 already scopes to an unrelated client-facing methodology system; and the normalization of the non-contract architecture_relevance value architecture_pressure_not_g4_decision to future_implementation_requirement on RD-C1, RD-C3, RD-C4, RD-C5, and RD-C7
