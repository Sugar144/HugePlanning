    authorization" posture already used for G2/G3's later Owner-review
    corrections and G4's in-unit independent review. Unlike those three,
    this review runs as its own governed unit, entirely separate from and
    subsequent to the G5-A authoring session, per the Project Owner's own
    explicit G5 sub-gate split.
