  g5b_review_authorized: true
  g5b_review_authorization_basis: >-
    HP-PROMPT-053/0.1.0 directly authorizes exactly the independent,
    clean-session review that GOV-GEN-G5-CONTRACT-001/0.1.0 §9 and
    GOV-GEN-DECISION-014/0.1.0 both named as G5's necessary next governed
