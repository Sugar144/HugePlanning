    - AET_CWG_or_SVP_modification
    - g4_phase_authorization
  external_source_record: null
  reconciliation_note: >-
    This record canonicalizes the Project Owner's direct, single-prompt
    authorization of G3's canonical definition, execution, and one bounded
    local commit (HP-PROMPT-047/0.1.0) into durable GOV-GEN-AUD-001
    custody, mirroring the G2 pattern under GOV-GEN-DECISION-004/0.1.0.
    G3 organizes, without reclassifying or redisposing, the 88 accepted G2
    capabilities and 6 accepted G2 gaps into a proposed eight-layer logical
    model (L0 core, L1 configurable policy, L2 optional modules, L3
    project-specific projections, L4 provider/executor adapters, L5
    canonical evidence, L6 deterministic validation/query tooling, L7
    bounded model/agent context projections), disposes of G2 §21
    unresolved questions 1-7 against that model without resolving any of
    them into an implemented decision, and recommends one candidate
    architecture with two rejected alternatives. Acceptance of the
    resulting Logical Architecture deliverable remains a separate,
    subsequent Owner act, not performed by this decision.
  next_governed_state: >-
    The Logical Architecture (GOV-GEN-G3-LOGICAL-ARCHITECTURE-001/0.1.0) is
    G3_READY_FOR_PROJECT_OWNER_REVIEW. The next governed state is Project
    Owner review and acceptance (or rejection, or a bounded correction
    request) of that result; only after such acceptance may the Owner
    separately authorize G4. This decision does not itself accept the
    Logical Architecture, and does not open, scope, or authorize G4 or any
    physical-architecture work.
  firewall_preserved: GOV-AUD-001 and its internal GOV-n state are unaffected
    by this decision.
  publication: {commit_authorized: true, push_authorized: false, pull_request_authorized: false, merge_authorized: false, tag_authorized: false, release_authorized: false, deployment_authorized: false}
