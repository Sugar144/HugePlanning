project_owner_decision:
  decision_id: GOV-GEN-DECISION-008
  version: 0.1.0
  date: '2026-08-05'
  authority: PROJECT_OWNER_EXPLICIT
  decision: AUTHORIZE_AND_RECORD_GOV_GEN_G3_CONTRACT_DEFINITION_EXECUTION_AND_LOCAL_COMMIT
  program_id: GOV-GEN-AUD-001
  phase: G3
  subject_contract: GOV-GEN-G3-CONTRACT-001/0.1.0
  subject_deliverable: GOV-GEN-G3-LOGICAL-ARCHITECTURE-001/0.1.0
  source_prompt: HP-PROMPT-047/0.1.0
  authorized:
    - canonical definition of G3 (Logical Architecture and Layering
      Assessment) as one contract, GOV-GEN-G3-CONTRACT-001/0.1.0
    - execution of that contract within the same governed unit, with no
      further, separate Owner authorization gate between contract
      acceptance and execution
    - allocation of all 88 accepted G2-classified capabilities and all 6
      accepted G2-dispositioned gaps to a proposed logical layer model
    - disposition of G2 §21 unresolved questions 1-7 against that model
    - a targeted, recorded lookup into the accepted G1B Governance
      Capability Map for capability obligation/realized_by fields, needed
      for accurate layer allocation, without rereading the 679-row G1A
      corpus and without redoing the 88 G2 classifications
    - creation of the minimum decision/state/index reconciliation
      artifacts required by existing GOV-GEN conventions
    - one bounded local commit
  g3_execution_authorized: true
  g3_execution_authorization_basis: >-
    HP-PROMPT-047/0.1.0 itself grants canonical definition, execution, and
    one bounded local commit directly, in a single governed unit, mirroring
    the G2 pattern (HP-PROMPT-043/0.1.0, GOV-GEN-DECISION-004/0.1.0). This
    decision reconciles that already-granted authorization into durable
    GOV-GEN custody; it does not itself add a new gate.
  g3_execution_performed_by_this_decision: false
  not_authorized:
    - push
    - target_physical_architecture_selection
    - kernel_repository_ownership_decision
    - new_repository_creation
    - kernel_extraction_or_migration
    - delegated_operational_authority_implementation
    - provider_neutral_governance_implementation
    - provider_or_executor_adapter_implementation
    - query_or_projection_tooling_implementation
    - implementation_of_any_recorded_g1b_or_g2_gap
    - reclassification_of_any_g2_capability
    - redisposition_of_any_g2_gap
    - AGENTS_md_or_CLAUDE_md_modification
    - AET_CWG_or_SVP_modification
    - GOV-AUD-001_advancement_or_modification
    - g4_phase_authorization
    - owner_acceptance_of_the_g3_logical_architecture
  execution_topology_rule: >-
    Single L1_CLEAN_SESSION, progressive navigation over the G2
    NAV-01..NAV-13 classification order. Evidence volume (88 capabilities,
    6 gaps) is explicitly not a session-split trigger; a split is warranted
    only by a genuinely independent decision, authority, validation,
    acceptance, or material-risk boundary (unchanged from
    GOV-GEN-G2-CONTRACT-001/0.1.0 §3 and GOV-GEN-G1B-CONTRACT-001/0.1.0
    §3.2).
  final_status: G3_CONTRACT_ACCEPTED_EXECUTED_AND_LOCALLY_COMMITTED_PENDING_OWNER_ACCEPTANCE
