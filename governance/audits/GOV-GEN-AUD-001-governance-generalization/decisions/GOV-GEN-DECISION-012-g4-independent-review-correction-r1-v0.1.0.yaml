  reconciliation_note: >-
    This record canonicalizes authorization of a bounded prospective
    correction to GOV-GEN-G4-CONSUMER-REQUIREMENTS-DELTA-001/0.1.0
    (HP-PROMPT-050/0.1.0), following the clean-session independent review
    that same prompt commissioned. The base deliverable is preserved
    unmodified as historical evidence, except for the completion of its own
    §7/§13/§14 placeholders with the review's actual output -- those
    placeholders were always designated to be filled once the review ran,
    per GOV-GEN-G4-CONTRACT-001/0.1.0 §3, not left as an open question this
    correction resolves. The correction itself is a new versioned artifact
    (GOV-GEN-G4-CONSUMER-REQUIREMENTS-DELTA-001-R1/0.1.0) read together with
    the base.
  next_governed_state: >-
    GOV-GEN-G4-CONSUMER-REQUIREMENTS-DELTA-001/0.1.0 together with its
    correction GOV-GEN-G4-CONSUMER-REQUIREMENTS-DELTA-001-R1/0.1.0 is
    G4_READY_FOR_PROJECT_OWNER_REVIEW. The next governed state is Project
    Owner acceptance (or rejection, or a further bounded correction request)
    of the corrected G4 result; only after such acceptance may the Owner
    separately authorize G5. This decision does not itself accept the G4
    result, and does not open, scope, or authorize G5.
  firewall_preserved: GOV-AUD-001 and its internal GOV-n state are unaffected
